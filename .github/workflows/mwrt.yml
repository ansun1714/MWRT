name: 🏗️ MWRT-DONGZAI 固件编译(显示内核)

on:
  workflow_dispatch:
    inputs:
      device:
        description: '📦 目标设备'
        required: true
        default: 'wh3000pro'
        type: choice
        options:
          - wh3000
          - wh3000pro
          - re-sp-01b

env:
  LEDE_REPO: https://github.com/coolsnowwolf/lede
  LEDE_BRANCH: master

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: 🎯 MWRT 固件工厂
        run: |
          cat << 'EOF'
            ____   ___  _   _  ____ _____    _    ___
           |  _ \ / _ \| \ | |/ ___|__  /  / \  |_ _|
           | | | | | | |  \| | |  _ / /  / _ \  | |
           | |_| | |_| | |\  | |_| |/ /__/ ___ \ | |
           |____/ \___/|_| \_|\____/____/_/   \_\___|
                  🏗️  固件工厂  ·  OpenWrt
          EOF
          DEVICE="${{ github.event.inputs.device }}"
          case "$DEVICE" in
            wh3000)     DNAME="华硅 WH3000" ; DSPEC="MT7981 ARM · 512MB RAM · eMMC" ;;
            wh3000pro)  DNAME="华硅 WH3000 Pro" ; DSPEC="MT7981 ARM · 512MB RAM · eMMC" ;;
            re-sp-01b)  DNAME="京东云无线宝 RE-SP-01B" ; DSPEC="MT7621 MIPS · 512MB RAM · 128GB eMMC" ;;
            *) echo "❌ 未知设备：$DEVICE"; exit 1 ;;
          esac
          echo "  ┌─────────────────────────────────────────┐"
          echo "  │  📦 设备：$DNAME"
          echo "  │  🔧 规格：$DSPEC"
          echo "  │  🕐 时间：$(date '+%Y-%m-%d %H:%M:%S UTC')"
          echo "  │  🔖 标识：MWRT-DONGZAI"
          echo "  └─────────────────────────────────────────┘"

      - name: 📥 检出仓库
        uses: actions/checkout@v4

      - name: 🧹 释放磁盘空间
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          sudo docker image prune -a -f
          sudo apt-get clean
          sudo swapoff -a || true
          sudo rm -f /swapfile
          echo "── 当前磁盘空间 ──"
          df -h

      - name: ⚙️ 初始化编译环境
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses5-dev libssl-dev python3 python3-pyelftools \
            rsync unzip zlib1g-dev file wget curl ccache cmake ninja-build \
            jq rename libelf-dev device-tree-compiler patch
          gcc --version | head -1
          python3 --version

      - name: 📦 克隆源码
        run: |
          git clone --depth=1 -b "$LEDE_BRANCH" "$LEDE_REPO" openwrt
          echo "── 源码最新提交 ──"
          git -C openwrt log --oneline -3

      - name: 🔧 DIY Part 1 - 配置 Feeds
        run: |
          chmod +x diy-part1.sh
          cd openwrt
          ../diy-part1.sh

      - name: 🔄 更新 & 安装 Feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 🎛️ 加载设备配置
        run: |
          DEVICE="${{ github.event.inputs.device }}"
          echo "── 加载配置：${DEVICE}.config ──"
          case "$DEVICE" in
            wh3000)    cp wh3000.config    openwrt/.config ;;
            wh3000pro) cp wh3000pro.config openwrt/.config ;;
            re-sp-01b) cp re-sp-01b.config openwrt/.config ;;
            *) echo "❌ 未知设备：$DEVICE"; exit 1 ;;
          esac
          if [ "$DEVICE" = "re-sp-01b" ]; then
            grep -v "CONFIG_TARGET_.*_DEVICE_" openwrt/.config > /tmp/.config_patched
            echo "CONFIG_TARGET_ramips_mt7621_DEVICE_jdcloud_re-sp-01b=y" >> /tmp/.config_patched
            cp /tmp/.config_patched openwrt/.config
            echo "✅ RE-SP-01B 设备目标已修正"
          fi
          grep "DEVICE_" openwrt/.config | grep -v "^#" || true

      - name: 🐧 配置内核版本
        run: |
          DEVICE="${{ github.event.inputs.device }}"
          sed -i \
            -e '/^CONFIG_TESTING_KERNEL=/d' \
            -e '/^# CONFIG_TESTING_KERNEL is not set/d' \
            -e '/^CONFIG_LINUX_6_6=/d' \
            -e '/^CONFIG_LINUX_6_12=/d' \
            -e '/^CONFIG_LINUX_6_18=/d' \
            openwrt/.config
          case "$DEVICE" in
            wh3000|wh3000pro)
              printf 'CONFIG_TESTING_KERNEL=y\n' >> openwrt/.config
              ;;
            re-sp-01b)
              printf '# CONFIG_TESTING_KERNEL is not set\n' >> openwrt/.config
              ;;
            *) echo "❌ 未知设备"; exit 1 ;;
          esac
          grep -E "CONFIG_TESTING_KERNEL|CONFIG_LINUX_6" openwrt/.config || true

      - name: 🔧 DIY Part 2 - 文件定制
        run: |
          chmod +x diy-part2.sh
          cd openwrt
          export DEVICE="${{ github.event.inputs.device }}"
          ../diy-part2.sh

      - name: 📋 生成最终配置
        run: |
          cd openwrt
          make defconfig
          # defconfig 会按 OpenVPN 默认值把 DCO 再打开，这里关死，不要再 defconfig
          sed -i \
            -e 's/^CONFIG_OPENVPN_.*ENABLE_DCO=y/# CONFIG_OPENVPN_openssl_ENABLE_DCO is not set/' \
            -e 's/^CONFIG_PACKAGE_kmod-ovpn-.*=y/# CONFIG_PACKAGE_kmod-ovpn-dco is not set/' \
            .config
          rm -rf feeds/packages/kernel/ovpn-dco package/feeds/packages/ovpn-dco
          echo "── TARGET ──"
          grep "CONFIG_TARGET_" .config | head -10 || true
          echo "── 内核 ──"
          grep -E "LINUX_6|LINUX_5|TESTING_KERNEL" .config | head -10 || true
          echo "── OpenVPN / ovpn（应该看不到 =y 的 kmod-ovpn）──"
          grep -E "ovpn|OPENVPN" .config | head -30 || true

      - name: ⬇️ 下载编译依赖
        run: |
          cd openwrt
          make download -j8
          find dl -size -1024c -exec ls -l {} \; 2>/dev/null || true

      - name: 🔨 编译固件
        id: compile
        run: |
          cd openwrt
          echo "CPU 核心：$(nproc)"
          free -h
          set -o pipefail
          if make -j$(nproc) V=s 2>&1 | tee /tmp/build.log; then
            echo "✅ 并行编译成功"
          else
            echo "======== Collected errors / 失败摘要 ========"
            grep -nE "Collected errors|satisfy_dependencies|check_data_file_clashes|Cannot install|opkg_install|ERROR: package|incompatible-pointer|ovpn-dco|Error [0-9]" /tmp/build.log | tail -80 || true
            echo "======== 日志尾部 ========"
            tail -80 /tmp/build.log || true
            exit 1
          fi

      - name: 📋 上传失败编译日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: MWRT-build-log-\( {{ github.event.inputs.device }}- \){{ github.run_number }}
          path: |
            /tmp/build.log
            openwrt/tmp/
          retention-days: 14
          if-no-files-found: ignore

      - name: 🔍 获取完整内核版本
        id: kernel
        run: |
          cd openwrt
          KERNEL=$(make kernelversion 2>/dev/null | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1 || echo "")
          if [ -z "$KERNEL" ]; then
            KERNEL=$(find build_dir -type d -name "linux-*" 2>/dev/null | sed 's#^.*/linux-##' | grep -oE '^[0-9]+\.[0-9]+\.[0-9]+' | sort -V | tail -1 || echo "")
          fi
          if [ -z "$KERNEL" ]; then
            MAJOR_MINOR=$(grep "^CONFIG_LINUX_[0-9_]*=y" .config | head -1 | sed 's/CONFIG_LINUX_//' | sed 's/=y//' | tr '_' '.')
            [ -n "\( MAJOR_MINOR" ] && KERNEL=" \){MAJOR_MINOR}.*" || KERNEL="Unknown"
          fi
          echo "kernel=$KERNEL" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "build_time=$(date '+%Y-%m-%d %H:%M UTC')" >> "$GITHUB_OUTPUT"
          echo "完整内核版本 : $KERNEL"

      - name: 📁 整理固件
        id: organize
        run: |
          mkdir -p upload
          find openwrt/bin/targets/ -type f \( -name "*.bin" -o -name "*.img.gz" -o -name "*.itb" -o -name "*.tar" \) -exec cp {} upload/ \;
          cd upload
          for f in *; do
            [ -f "$f" ] || continue
            newname=$(echo "$f" | sed 's/openwrt/MWRT-DONGZAI/g; s/lede/MWRT-DONGZAI/g')
            [ "$f" != "$newname" ] && mv "$f" "$newname"
          done
          ls -lh
          if [ -z "$(ls -A .)" ]; then
            echo "❌ 未找到固件文件"
            exit 1
          fi

      - name: 📤 上传 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MWRT-DONGZAI_\( {{ github.event.inputs.device }}_K \){{ steps.kernel.outputs.kernel }}_${{ github.run_number }}
          path: upload/
          retention-days: 30

      - name: 🏷️ 生成 Release 标签
        id: tag
        run: |
          DEVICE="${{ github.event.inputs.device }}"
          KERNEL="${{ steps.kernel.outputs.kernel }}"
          TAG="MWRT-DONGZAI-\( {DEVICE^^}-K \){KERNEL}-\( (date +'%Y.%m.%d')- \)(date +'%H%M')"
          echo "release_tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "release_date=$(date +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"
          echo "生成 Tag：$TAG"

      - name: 🚀 发布到 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.release_tag }}
          name: "🏗️ MWRT-DONGZAI · ${{ github.event.inputs.device }} · Linux ${{ steps.kernel.outputs.kernel }}"
          files: upload/*
          body: |
            ## 🏗️ MWRT 固件工厂
            | 项目 | 内容 |
            |---|---|
            | 📦 设备 | ${{ github.event.inputs.device }} |
            | 🐧 Linux 内核 | ${{ steps.kernel.outputs.kernel }} |
            | 🔖 MWRT Commit | ${{ steps.kernel.outputs.commit }} |
            | 🕐 编译时间 | ${{ steps.kernel.outputs.build_time }} |
            | 📅 编译日期 | ${{ steps.tag.outputs.release_date }} |
            | 🔖 标识 | MWRT-DONGZAI |

            ### 固件文件
            | 文件 | 用途 |
            |---|---|
            | `*-initramfs-kernel.bin` | 首次刷机 / TFTP |
            | `*-squashfs-sysupgrade.bin` | ✅ 日常升级 |

            OpenVPN 用户态可用，Linux 6.18 外置 ovpn-dco 已关闭（内核已内置 ovpn）。
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
