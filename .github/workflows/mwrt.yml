name: 🏗️ MWRT-DONGZAI 固件编译(显示内核)

on:
  workflow_dispatch:
    inputs:
      device:
        description: '📦 目标设备'
        required: true
        default: 'wh3000pro'
        type: choice
        options:
          - wh3000        # 华硅 WH3000       · MT7981 ARM · 512MB
          - wh3000pro     # 华硅 WH3000 Pro   · MT7981 ARM · 512MB
          - re-sp-01b     # 京东云无线宝       · MT7621 MIPS · 512MB

env:
  LEDE_REPO: https://github.com/coolsnowwolf/lede
  LEDE_BRANCH: master

jobs:
  build:
    runs-on: ubuntu-22.04

    permissions:
      contents: write

    steps:

      # ============================================================
      # 1. 固件工厂信息
      # ============================================================
      - name: 🎯 MWRT 固件工厂
        run: |
          cat << 'EOF'

            ____   ___  _   _  ____ _____    _    ___
           |  _ \ / _ \| \ | |/ ___|__  /  / \  |_ _|
           | | | | | | |  \| | |  _ / /  / _ \  | |
           | |_| | |_| | |\  | |_| |/ /__/ ___ \ | |
           |____/ \___/|_| \_|\____/____/_/   \_\___|
                  🏗️  固件工厂  ·  OpenWrt

          EOF

          DEVICE="${{ github.event.inputs.device }}"

          case "$DEVICE" in
            wh3000)
              DNAME="华硅 WH3000"
              DSPEC="MT7981 ARM · 512MB RAM · eMMC"
              ;;
            wh3000pro)
              DNAME="华硅 WH3000 Pro"
              DSPEC="MT7981 ARM · 512MB RAM · eMMC"
              ;;
            re-sp-01b)
              DNAME="京东云无线宝 RE-SP-01B"
              DSPEC="MT7621 MIPS · 512MB RAM · 128GB eMMC"
              ;;
            *)
              echo "❌ 未知设备：$DEVICE"
              exit 1
              ;;
          esac

          echo "  ┌─────────────────────────────────────────┐"
          echo "  │  📦 设备：$DNAME"
          echo "  │  🔧 规格：$DSPEC"
          echo "  │  🕐 时间：$(date '+%Y-%m-%d %H:%M:%S UTC')"
          echo "  │  🔖 标识：MWRT-DONGZAI"
          echo "  └─────────────────────────────────────────┘"


      # ============================================================
      # 2. 检出 MWRT 仓库
      # ============================================================
      - name: 📥 检出仓库
        uses: actions/checkout@v4


      # ============================================================
      # 3. 释放磁盘空间
      # ============================================================
      - name: 🧹 释放磁盘空间
        run: |
          sudo rm -rf /usr/share/dotnet \
                      /opt/ghc \
                      /usr/local/lib/android \
                      /opt/hostedtoolcache/CodeQL

          sudo docker image prune -a -f
          sudo apt-get clean

          sudo swapoff -a || true
          sudo rm -f /swapfile

          echo "── 当前磁盘空间 ──"
          df -h


      # ============================================================
      # 4. 初始化编译环境
      # ============================================================
      - name: ⚙️ 初始化编译环境
        run: |
          sudo apt-get update -q

          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            g++ \
            gawk \
            gcc-multilib \
            g++-multilib \
            gettext \
            git \
            libncurses5-dev \
            libssl-dev \
            python3 \
            python3-pyelftools \
            rsync \
            unzip \
            zlib1g-dev \
            file \
            wget \
            curl \
            ccache \
            cmake \
            ninja-build \
            jq \
            rename \
            libelf-dev \
            device-tree-compiler \
            patch

          echo "── 编译工具版本 ──"
          gcc --version | head -1
          clang --version | head -1
          python3 --version
          ccache --version | head -1


      # ============================================================
      # 5. 克隆 LEDE
      # ============================================================
      - name: 📦 克隆源码
        run: |
          git clone \
            --depth=1 \
            -b "$LEDE_BRANCH" \
            "$LEDE_REPO" \
            openwrt

          echo "── 源码最新提交 ──"
          git -C openwrt log --oneline -3


      # ============================================================
      # 6. DIY Part 1
      #
      # 这里会执行：
      #
      # Lucky
      # Qmodem
      # rtp2httpd
      # helloworld
      # MSD Lite
      # IPTV Manager
      # OpenClash
      # RE-SP-01B 分区
      # QMI WWAN
      # Linux 6.18 MediaTek WED 942 修复
      #
      # ============================================================
      - name: 🔧 DIY Part 1 - 配置 Feeds
        run: |
          chmod +x diy-part1.sh

          cd openwrt

          ../diy-part1.sh


      # ============================================================
      # 7. 更新 & 安装 Feeds
      # ============================================================
      - name: 🔄 更新 & 安装 Feeds
        run: |
          cd openwrt

          ./scripts/feeds update -a

          ./scripts/feeds install -a


      # ============================================================
      # 8. 加载设备配置
      # ============================================================
      - name: 🎛️ 加载设备配置
        run: |
          DEVICE="${{ github.event.inputs.device }}"

          echo "── 加载配置：${DEVICE}.config ──"

          case "$DEVICE" in

            wh3000)
              cp wh3000.config openwrt/.config
              ;;

            wh3000pro)
              cp wh3000pro.config openwrt/.config
              ;;

            re-sp-01b)
              cp re-sp-01b.config openwrt/.config
              ;;

            *)
              echo "❌ 未知设备：$DEVICE"
              exit 1
              ;;

          esac


          # ========================================================
          # RE-SP-01B TARGET 修正
          # ========================================================

          if [ "$DEVICE" = "re-sp-01b" ]; then

            grep -v "CONFIG_TARGET_.*_DEVICE_" openwrt/.config \
              > /tmp/.config_patched

            echo \
              "CONFIG_TARGET_ramips_mt7621_DEVICE_jdcloud_re-sp-01b=y" \
              >> /tmp/.config_patched

            cp /tmp/.config_patched openwrt/.config

            echo "✅ RE-SP-01B 设备目标已修正"

          else

            echo "✅ ${DEVICE}：直接使用 config 文件中的设备配置"

          fi


          echo "── 当前设备目标 ──"

          grep "DEVICE_" openwrt/.config \
            | grep -v "^#" || true


      # ============================================================
      # 9. 配置内核
      #
      # WH3000 / WH3000 Pro：
      #     CONFIG_TESTING_KERNEL=y
      #
      # 自动跟随 LEDE 最新 Linux 6.18 testing kernel
      #
      # RE-SP-01B：
      #     禁用 testing kernel
      #     使用稳定内核
      #
      # ============================================================
      - name: 🐧 配置内核版本
        run: |
          DEVICE="${{ github.event.inputs.device }}"

          case "$DEVICE" in

            wh3000|wh3000pro)

              # 防止重复配置
              sed -i '/CONFIG_TESTING_KERNEL=/d' openwrt/.config
              sed -i '/CONFIG_LINUX_6_6=/d' openwrt/.config
              sed -i '/CONFIG_LINUX_6_12=/d' openwrt/.config
              sed -i '/CONFIG_LINUX_6_18=/d' openwrt/.config

              printf 'CONFIG_TESTING_KERNEL=y\n' \
                >> openwrt/.config

              echo "✅ Filogic ARM：已启用最新测试内核"

              ;;


            re-sp-01b)

              sed -i '/CONFIG_TESTING_KERNEL=/d' openwrt/.config
              sed -i '/CONFIG_LINUX_6_6=/d' openwrt/.config
              sed -i '/CONFIG_LINUX_6_12=/d' openwrt/.config
              sed -i '/CONFIG_LINUX_6_18=/d' openwrt/.config

              printf '# CONFIG_TESTING_KERNEL is not set\n' \
                >> openwrt/.config

              echo "⏭️ MT7621 MIPS：使用稳定内核（5.x）"

              ;;

          esac


      # ============================================================
      # 10. DIY Part 2
      # ============================================================
      - name: 🔧 DIY Part 2 - 文件定制
        run: |
          chmod +x diy-part2.sh

          cd openwrt

          export DEVICE="${{ github.event.inputs.device }}"

          ../diy-part2.sh


      # ============================================================
      # 11. 生成最终配置
      # ============================================================
      - name: 📋 生成最终配置
        run: |
          cd openwrt

          make defconfig

          echo "── TARGET 配置 ──"

          grep "CONFIG_TARGET_" .config \
            | head -10 || true

          echo "── 内核版本 ──"

          grep -E \
            "LINUX_6|LINUX_5|TESTING_KERNEL" \
            .config \
            | head -10 || true


      # ============================================================
      # 12. 下载编译依赖
      # ============================================================
      - name: ⬇️ 下载编译依赖
        run: |
          cd openwrt

          make download -j8

          echo "── 检查异常下载文件 ──"

          find dl \
            -size -1024c \
            -exec ls -l {} \; \
            2>/dev/null || true


      # ============================================================
      # 13. 编译固件
      #
      # 这里是本次 Workflow 的重要修复。
      #
      # 原来的：
      #
      # make | tee | grep || true
      #
      # 会干扰真正的 make 返回值。
      #
      # 现在：
      #
      # set -o pipefail
      #
      # 确保 make 真失败时，GitHub Actions 正确失败。
      #
      # ============================================================
      - name: 🔨 编译固件
        id: compile
        run: |
          cd openwrt

          echo "── 开始编译，CPU 核心：$(nproc) ──"

          set -o pipefail

          if make -j$(nproc) V=s 2>&1 | tee /tmp/build.log; then

            echo "✅ 并行编译完成"

          else

            echo ""
            echo "============================================================"
            echo "❌ 并行编译失败"
            echo "============================================================"

            echo ""
            echo "── 最后 200 行错误日志 ──"

            tail -200 /tmp/build.log || true

            echo ""
            echo "── 编译失败位置搜索 ──"

            grep -E \
              "Hunk .*FAILED|ERROR:|error:|Error |FAILED|failed" \
              /tmp/build.log \
              | tail -100 || true

            exit 1

          fi


      # ============================================================
      # 14. 编译失败上传日志
      #
      # 如果以后再出现：
      #
      # Hunk FAILED
      # kernel error
      # package error
      # DTS error
      #
      # 可以直接下载完整日志。
      #
      # ============================================================
      - name: 📋 上传失败编译日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: MWRT-build-log-${{ github.event.inputs.device }}-${{ github.run_number }}
          path: |
            /tmp/build.log
            openwrt/tmp/
          retention-days: 14
          if-no-files-found: ignore


      # ============================================================
      # 15. 获取完整内核版本
      # ============================================================
      - name: 🔍 获取完整内核版本
        id: kernel
        run: |
          cd openwrt

          # ========================================================
          # 策略 1：
          # make kernelversion
          # ========================================================

          KERNEL=$(
            make kernelversion 2>/dev/null \
            | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' \
            | head -1 \
            || echo ""
          )


          # ========================================================
          # 策略 2：
          # 搜索 build_dir
          # ========================================================

          if [ -z "$KERNEL" ]; then

            echo "⚠️ make kernelversion 未获取到版本"

            KERNEL=$(
              find build_dir \
                -type d \
                -name "linux-*" \
                2>/dev/null \
                | sed 's#^.*/linux-##' \
                | grep -oE '^[0-9]+\.[0-9]+\.[0-9]+' \
                | sort -V \
                | tail -1 \
                || echo ""
            )

          fi


          # ========================================================
          # 策略 3：
          # 从 .config 获取
          # ========================================================

          if [ -z "$KERNEL" ]; then

            echo "⚠️ 未找到完整版本，从 .config 获取大版本"

            MAJOR_MINOR=$(
              grep "^CONFIG_LINUX_[0-9_]*=y" .config \
              | head -1 \
              | sed 's/CONFIG_LINUX_//' \
              | sed 's/=y//' \
              | tr '_' '.'
            )

            if [ -n "$MAJOR_MINOR" ]; then

              KERNEL="${MAJOR_MINOR}.*"

            else

              KERNEL="Unknown"

            fi

          fi


          COMMIT=$(git rev-parse --short HEAD)

          BUILD_TIME=$(date '+%Y-%m-%d %H:%M UTC')


          echo "kernel=$KERNEL" \
            >> "$GITHUB_OUTPUT"

          echo "commit=$COMMIT" \
            >> "$GITHUB_OUTPUT"

          echo "build_time=$BUILD_TIME" \
            >> "$GITHUB_OUTPUT"


          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          echo "完整内核版本 : $KERNEL"
          echo "MWRT Commit  : $COMMIT"
          echo "编译时间     : $BUILD_TIME"

          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"


      # ============================================================
      # 16. 整理固件
      # ============================================================
      - name: 📁 整理固件
        id: organize
        run: |
          mkdir -p upload

          # ========================================================
          # 搜索固件
          # ========================================================

          find openwrt/bin/targets/ \
            -type f \
            \( \
              -name "*.bin" \
              -o -name "*.img.gz" \
              -o -name "*.itb" \
              -o -name "*.tar" \
            \) \
            -exec cp {} upload/ \;


          cd upload


          # ========================================================
          # 统一重命名
          # ========================================================

          for f in *; do

            [ -f "$f" ] || continue

            newname=$(
              echo "$f" \
              | sed \
                's/openwrt/MWRT-DONGZAI/g;
                 s/lede/MWRT-DONGZAI/g'
            )

            if [ "$f" != "$newname" ]; then
              mv "$f" "$newname"
            fi

          done


          echo "── 固件列表 ──"

          ls -lh


          # ========================================================
          # 检查固件
          # ========================================================

          if [ -z "$(ls -A .)" ]; then

            echo "❌ 警告：未找到固件文件"

            exit 1

          fi


          echo "✅ 固件整理完成，共 $(ls | wc -l) 个文件"


      # ============================================================
      # 17. 上传 Artifact
      # ============================================================
      - name: 📤 上传 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MWRT-DONGZAI_${{ github.event.inputs.device }}_K${{ steps.kernel.outputs.kernel }}_${{ github.run_number }}
          path: upload/
          retention-days: 30


      # ============================================================
      # 18. 生成 Release 标签
      # ============================================================
      - name: 🏷️ 生成 Release 标签
        id: tag
        run: |
          DEVICE="${{ github.event.inputs.device }}"

          DATE=$(date +'%Y-%m-%d')

          TIME=$(date +'%H%M')

          KERNEL="${{ steps.kernel.outputs.kernel }}"

          TAG="MWRT-DONGZAI-${DEVICE^^}-K${KERNEL}-$(date +'%Y.%m.%d')-${TIME}"

          echo "release_tag=$TAG" \
            >> "$GITHUB_OUTPUT"

          echo "release_date=$DATE" \
            >> "$GITHUB_OUTPUT"

          echo "生成 Tag：$TAG"


      # ============================================================
      # 19. 发布 Release
      # ============================================================
      - name: 🚀 发布到 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.release_tag }}

          name: "🏗️ MWRT-DONGZAI · ${{ github.event.inputs.device }} · Linux ${{ steps.kernel.outputs.kernel }}"

          files: upload/*

          body: |
            ## 🏗️ MWRT 固件工厂

            | 项目 | 内容 |
            |---|---|
            | 📦 设备 | ${{ github.event.inputs.device }} |
            | 🐧 Linux 内核 | ${{ steps.kernel.outputs.kernel }} |
            | 🔖 MWRT Commit | ${{ steps.kernel.outputs.commit }} |
            | 🕐 编译时间 | ${{ steps.kernel.outputs.build_time }} |
            | 📅 编译日期 | ${{ steps.tag.outputs.release_date }} |
            | 🔖 标识 | MWRT-DONGZAI |

            ### Linux 6.18 兼容

            WH3000 / WH3000 Pro 使用最新 Testing Kernel。

            DIY Part 1 会在编译前自动检查并修复
            MediaTek WED 942 补丁，以适配 Linux 6.18.x
            新版 `mtk_wed_mcu.c`。

            ### 固件文件说明

            | 文件 | 用途 |
            |---|---|
            | `*-initramfs-kernel.bin` | 首次刷机 / TFTP 恢复 |
            | `*-squashfs-sysupgrade.bin` | ✅ 日常升级固件（推荐） |

            ### 刷机注意

            - 首次刷入请先备份原厂固件
            - 建议使用 `sysupgrade` 命令升级
            - 不同设备严禁刷错固件
            - 升级时建议不要保留旧配置

            ---

            🤖 由 GitHub Actions 自动编译 · MWRT 固件工厂

          generate_release_notes: false

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
