name: 🏗️ MWRT-DONGZAI 固件编译 - 最终稳定版

on:
  workflow_dispatch:
    inputs:
      device:
        description: '📦 目标设备'
        required: true
        default: 'wh3000pro'
        type: choice
        options:
          - wh3000
          - wh3000pro
          - re-sp-01b

      build_mode:
        description: '⚡ 编译模式'
        required: true
        default: 'fast'
        type: choice
        options:
          - fast
          - clean

env:
  LEDE_REPO: https://github.com/coolsnowwolf/lede
  LEDE_BRANCH: master

  MAKE_JOBS: 4

  LOG_DIR: /tmp/mwrt-logs

  CCACHE_MAXSIZE: 5G
  CCACHE_COMPRESS: 1

jobs:

  build:

    name: "🏗️ MWRT-${{ github.event.inputs.device }}"

    runs-on: ubuntu-22.04

    permissions:
      contents: write

    steps:

      # ==========================================================
      # 01. 工厂信息
      # ==========================================================

      - name: 🎯 MWRT 固件工厂
        shell: bash
        run: |
          set -Eeuo pipefail

          mkdir -p "$LOG_DIR"

          DEVICE="${{ github.event.inputs.device }}"
          BUILD_MODE="${{ github.event.inputs.build_mode }}"

          case "$DEVICE" in

            wh3000)
              DNAME="华硅 WH3000"
              DSPEC="MT7981 ARM64 · 512MB RAM · eMMC"
              ;;

            wh3000pro)
              DNAME="华硅 WH3000 Pro"
              DSPEC="MT7981 ARM64 · 512MB RAM · eMMC"
              ;;

            re-sp-01b)
              DNAME="京东云无线宝 RE-SP-01B"
              DSPEC="MT7621 MIPS · 512MB RAM · 128GB eMMC"
              ;;

            *)
              echo "❌ 未知设备：$DEVICE"
              exit 1
              ;;

          esac

          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🏗️ MWRT-DONGZAI 固件工厂"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          echo "📦 设备       : $DNAME"
          echo "🔧 规格       : $DSPEC"
          echo "⚡ 编译模式   : $BUILD_MODE"
          echo "🧵 MAKE_JOBS  : $MAKE_JOBS"
          echo "🐧 Runner     : $(uname -a)"
          echo "🕐 时间       : $(date '+%Y-%m-%d %H:%M:%S UTC')"

          {
            echo "DEVICE=$DEVICE"
            echo "BUILD_MODE=$BUILD_MODE"
            echo "DNAME=$DNAME"
            echo "DSPEC=$DSPEC"
            echo "MAKE_JOBS=$MAKE_JOBS"
          } > "$LOG_DIR/environment.txt"


      # ==========================================================
      # 02. 检出 MWRT
      # ==========================================================

      - name: 📥 检出 MWRT 仓库
        uses: actions/checkout@v4


      # ==========================================================
      # 03. 检查配置
      # ==========================================================

      - name: 🔎 检查 MWRT 配置
        shell: bash
        run: |
          set -Eeuo pipefail

          DEVICE="${{ github.event.inputs.device }}"

          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🔎 检查配置文件"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          test -f "$DEVICE.config" || {
            echo "❌ 缺少 $DEVICE.config"
            exit 1
          }

          test -f diy-part1.sh || {
            echo "❌ 缺少 diy-part1.sh"
            exit 1
          }

          test -f diy-part2.sh || {
            echo "❌ 缺少 diy-part2.sh"
            exit 1
          }

          echo "✅ $DEVICE.config"
          echo "✅ diy-part1.sh"
          echo "✅ diy-part2.sh"

          {
            sha256sum "$DEVICE.config"
            sha256sum diy-part1.sh
            sha256sum diy-part2.sh
          } | tee "$LOG_DIR/mwrt-hash.txt"


      # ==========================================================
      # 04. 缓存 Hash
      # ==========================================================

      - name: 🔐 生成缓存哈希
        id: hash
        shell: bash
        run: |
          set -Eeuo pipefail

          DEVICE="${{ github.event.inputs.device }}"

          CONFIG_HASH=$(
            sha256sum "$DEVICE.config" |
            awk '{print $1}' |
            cut -c1-16
          )

          DIY_HASH=$(
            {
              sha256sum diy-part1.sh
              sha256sum diy-part2.sh

              if [ -d files ]; then
                find files -type f -print0 |
                  sort -z |
                  xargs -0 sha256sum
              fi
            } |
            sha256sum |
            awk '{print $1}' |
            cut -c1-16
          )

          echo "config_hash=$CONFIG_HASH" >> "$GITHUB_OUTPUT"
          echo "diy_hash=$DIY_HASH" >> "$GITHUB_OUTPUT"

          echo "CONFIG_HASH=$CONFIG_HASH"
          echo "DIY_HASH=$DIY_HASH"


      # ==========================================================
      # 05. 释放 Runner 磁盘
      # ==========================================================

      - name: 🧹 释放 Runner 磁盘
        shell: bash
        run: |
          set -Eeuo pipefail

          sudo rm -rf \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/local/lib/android \
            /opt/hostedtoolcache/CodeQL \
            || true

          sudo docker image prune -a -f || true
          sudo apt-get clean || true

          echo
          echo "── 磁盘 ──"
          df -h

          echo
          echo "── 内存 ──"
          free -h


      # ==========================================================
      # 06. 编译环境
      # ==========================================================

      - name: ⚙️ 初始化编译环境
        shell: bash
        run: |
          set -Eeuo pipefail

          sudo apt-get update -q

          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            g++ \
            gawk \
            gcc-multilib \
            g++-multilib \
            gettext \
            git \
            libncurses5-dev \
            libssl-dev \
            python3 \
            python3-pyelftools \
            rsync \
            unzip \
            zlib1g-dev \
            file \
            wget \
            curl \
            ccache \
            cmake \
            ninja-build \
            jq \
            rename \
            libelf-dev \
            device-tree-compiler \
            bc \
            time \
            xz-utils \
            zip \
            tar \
            gzip

          echo
          git --version
          gcc --version | head -1
          clang --version | head -1
          ccache --version | head -1
          python3 --version


      # ==========================================================
      # 07. Clean 模式
      # ==========================================================

      - name: 🧹 Clean 模式
        if: github.event.inputs.build_mode == 'clean'
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "🧹 CLEAN MODE"

          sudo rm -rf openwrt
          rm -rf ~/.ccache

          echo "✅ OpenWrt 构建目录已清理"
          echo "✅ ccache 已清理"


      # ==========================================================
      # 08. 克隆 LEDE
      # ==========================================================

      - name: 📦 克隆 LEDE
        shell: bash
        run: |
          set -Eeuo pipefail

          rm -rf openwrt

          git clone \
            --depth=1 \
            --single-branch \
            -b "$LEDE_BRANCH" \
            "$LEDE_REPO" \
            openwrt

          cd openwrt

          LEDE_COMMIT=$(git rev-parse HEAD)
          LEDE_SHORT=$(git rev-parse --short HEAD)

          echo "LEDE_COMMIT=$LEDE_COMMIT" >> "$GITHUB_ENV"
          echo "LEDE_SHORT=$LEDE_SHORT" >> "$GITHUB_ENV"

          echo "LEDE_COMMIT=$LEDE_COMMIT"
          echo "LEDE_SHORT=$LEDE_SHORT"

          git log --oneline -5 |
            tee "$LOG_DIR/lede-log.txt"


      # ==========================================================
      # 09. 源码信息
      # ==========================================================

      - name: 🧾 保存源码环境信息
        shell: bash
        run: |
          set -Eeuo pipefail

          cd openwrt

          {
            echo "========== LEDE =========="
            git remote -v

            echo
            echo "========== COMMIT =========="
            git rev-parse HEAD

            echo
            echo "========== BRANCH =========="
            git branch -a

            echo
            echo "========== STATUS =========="
            git status --short

            echo
            echo "========== DATE =========="
            date -u

          } | tee "$LOG_DIR/source-info.txt"


      # ==========================================================
      # 10. DIY Part 1
      # ==========================================================

      - name: 🔧 DIY Part 1 - Feeds
        shell: bash
        run: |
          set -Eeuo pipefail

          chmod +x diy-part1.sh

          cd openwrt

          ../diy-part1.sh \
            2>&1 |
            tee "$LOG_DIR/diy-part1.log"

          STATUS=${PIPESTATUS[0]}

          if [ "$STATUS" -ne 0 ]; then
            echo "❌ diy-part1.sh 失败"
            exit "$STATUS"
          fi

          echo "✅ DIY Part 1 完成"


      # ==========================================================
      # 11. Feeds Cache
      # ==========================================================

      - name: ♻️ 恢复 Feeds 缓存
        if: github.event.inputs.build_mode == 'fast'
        id: feeds_restore
        uses: actions/cache/restore@v4
        with:
          path: |
            openwrt/feeds
            openwrt/package/feeds

          key: feeds-${{ runner.os }}-${{ github.event.inputs.device }}-${{ env.LEDE_SHORT }}-${{ steps.hash.outputs.diy_hash }}

          restore-keys: |
            feeds-${{ runner.os }}-${{ github.event.inputs.device }}-${{ env.LEDE_SHORT }}-


      # ==========================================================
      # 12. 更新 Feeds
      # ==========================================================

      - name: 🔄 更新 & 安装 Feeds
        shell: bash
        run: |
          set -Eeuo pipefail

          cd openwrt

          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🔄 Feeds"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          if [ "${{ github.event.inputs.build_mode }}" = "clean" ]; then

            ./scripts/feeds update -a \
              2>&1 |
              tee "$LOG_DIR/feeds-update.log"

            STATUS=${PIPESTATUS[0]}
            [ "$STATUS" -eq 0 ] || exit "$STATUS"

            ./scripts/feeds install -a \
              2>&1 |
              tee "$LOG_DIR/feeds-install.log"

            STATUS=${PIPESTATUS[0]}
            [ "$STATUS" -eq 0 ] || exit "$STATUS"

          elif [ "${{ steps.feeds_restore.outputs.cache-hit }}" != "true" ]; then

            ./scripts/feeds update -a \
              2>&1 |
              tee "$LOG_DIR/feeds-update.log"

            STATUS=${PIPESTATUS[0]}
            [ "$STATUS" -eq 0 ] || exit "$STATUS"

            ./scripts/feeds install -a \
              2>&1 |
              tee "$LOG_DIR/feeds-install.log"

            STATUS=${PIPESTATUS[0]}
            [ "$STATUS" -eq 0 ] || exit "$STATUS"

          else

            echo "⚡ Feeds 缓存命中，跳过更新"

          fi

          ./scripts/feeds list -s |
            tee "$LOG_DIR/feeds-list.txt"


      # ==========================================================
      # 13. 加载设备配置
      # ==========================================================

      - name: 🎛️ 加载设备配置
        shell: bash
        run: |
          set -Eeuo pipefail

          DEVICE="${{ github.event.inputs.device }}"

          case "$DEVICE" in

            wh3000)
              cp wh3000.config openwrt/.config
              ;;

            wh3000pro)
              cp wh3000pro.config openwrt/.config
              ;;

            re-sp-01b)
              cp re-sp-01b.config openwrt/.config
              ;;

            *)
              echo "❌ 未知设备"
              exit 1
              ;;

          esac

          if [ "$DEVICE" = "re-sp-01b" ]; then

            grep -v \
              "CONFIG_TARGET_.*_DEVICE_" \
              openwrt/.config \
              > /tmp/.config_patched

            echo \
              "CONFIG_TARGET_ramips_mt7621_DEVICE_jdcloud_re-sp-01b=y" \
              >> /tmp/.config_patched

            cp /tmp/.config_patched openwrt/.config

          fi

          echo
          echo "── TARGET ──"

          grep "CONFIG_TARGET_" openwrt/.config |
            grep -v "^#" |
            tee "$LOG_DIR/target-config.txt"


      # ==========================================================
      # 14. 内核版本
      # ==========================================================

      - name: 🐧 配置内核版本
        shell: bash
        run: |
          set -Eeuo pipefail

          DEVICE="${{ github.event.inputs.device }}"

          cd openwrt

          case "$DEVICE" in

            wh3000|wh3000pro)

              sed -i \
                '/^CONFIG_TESTING_KERNEL=/d' \
                .config

              echo \
                "CONFIG_TESTING_KERNEL=y" \
                >> .config

              ;;

            re-sp-01b)

              sed -i \
                -e '/^CONFIG_TESTING_KERNEL=/d' \
                -e '/^CONFIG_LINUX_6_6=/d' \
                -e '/^CONFIG_LINUX_6_18=/d' \
                .config

              echo \
                "# CONFIG_TESTING_KERNEL is not set" \
                >> .config

              ;;

          esac

          echo
          echo "── Kernel Config ──"

          grep -E \
            'CONFIG_LINUX_|CONFIG_TESTING_KERNEL' \
            .config |
            tee "$LOG_DIR/kernel-config.txt" \
            || true


      # ==========================================================
      # 15. DIY Part 2
      # ==========================================================

      - name: 🔧 DIY Part 2 - 文件定制
        shell: bash
        run: |
          set -Eeuo pipefail

          chmod +x diy-part2.sh

          cd openwrt

          export DEVICE="${{ github.event.inputs.device }}"

          ../diy-part2.sh \
            2>&1 |
            tee "$LOG_DIR/diy-part2.log"

          STATUS=${PIPESTATUS[0]}

          if [ "$STATUS" -ne 0 ]; then
            echo "❌ diy-part2.sh 失败"
            exit "$STATUS"
          fi

          echo "✅ DIY Part 2 完成"
                # ==========================================================
      # 16. DEFCONFIG + QMODEM FINAL
      # ==========================================================

      - name: 📋 生成最终配置
        shell: bash
        run: |
          set -Eeuo pipefail

          cd openwrt

          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📋 MAKE DEFCONFIG"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          make defconfig \
            2>&1 |
            tee "$LOG_DIR/defconfig-1.log"

          STATUS=${PIPESTATUS[0]}

          if [ "$STATUS" -ne 0 ]; then
            echo "❌ 第一次 make defconfig 失败"
            exit "$STATUS"
          fi


          # ========================================================
          # 清理所有旧版 QModem
          # ========================================================

          sed -i \
            -e '/^CONFIG_PACKAGE_luci-app-qmodem=/d' \
            -e '/^CONFIG_PACKAGE_luci-app-qmodem-next=/d' \
            -e '/^CONFIG_PACKAGE_luci-app-qmodem-sms=/d' \
            -e '/^CONFIG_PACKAGE_luci-app-qmodem-ttl=/d' \
            -e '/^CONFIG_PACKAGE_luci-i18n-qmodem-zh-cn=/d' \
            -e '/^CONFIG_PACKAGE_luci-i18n-qmodem-sms-zh-cn=/d' \
            -e '/^CONFIG_PACKAGE_luci-i18n-qmodem-ttl-zh-cn=/d' \
            -e '/^CONFIG_PACKAGE_qmodem=/d' \
            -e '/^CONFIG_PACKAGE_qmodem-sipd=/d' \
            -e '/^CONFIG_PACKAGE_qmodem-voip=/d' \
            -e '/^CONFIG_PACKAGE_sms-forwarder-next=/d' \
            -e '/^CONFIG_PACKAGE_quectel-CM-5G-M=/d' \
            .config


          # ========================================================
          # 写入最终 QModem Next
          # ========================================================

          cat >> .config << 'EOF'

          # ============================================================
          # QModem Next
          # ============================================================

          CONFIG_PACKAGE_qmodem=y

          CONFIG_PACKAGE_luci-app-qmodem-next=y

          CONFIG_PACKAGE_sms-forwarder-next=y

          CONFIG_PACKAGE_quectel-CM-5G-M=y


          # ============================================================
          # 关闭旧版 QModem
          # ============================================================

          # CONFIG_PACKAGE_luci-app-qmodem is not set
          # CONFIG_PACKAGE_luci-app-qmodem-sms is not set
          # CONFIG_PACKAGE_luci-app-qmodem-ttl is not set


          # ============================================================
          # 关闭旧版 QModem 中文语言包
          # ============================================================

          # CONFIG_PACKAGE_luci-i18n-qmodem-zh-cn is not set
          # CONFIG_PACKAGE_luci-i18n-qmodem-sms-zh-cn is not set
          # CONFIG_PACKAGE_luci-i18n-qmodem-ttl-zh-cn is not set


          # ============================================================
          # 关闭 SIP / VOIP
          # ============================================================

          # CONFIG_PACKAGE_qmodem-sipd is not set
          # CONFIG_PACKAGE_qmodem-voip is not set

          EOF


          # ========================================================
          # 第二次 defconfig
          # ========================================================

          echo
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📋 SECOND MAKE DEFCONFIG"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          make defconfig \
            2>&1 |
            tee "$LOG_DIR/defconfig-2.log"

          STATUS=${PIPESTATUS[0]}

          if [ "$STATUS" -ne 0 ]; then
            echo "❌ 第二次 make defconfig 失败"
            exit "$STATUS"
          fi


          # ========================================================
          # QMODEM 最终检查
          # ========================================================

          echo
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📡 QMODEM NEXT FINAL CHECK"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          echo
          echo "── QModem ──"

          grep -E \
            '^CONFIG_PACKAGE_(qmodem|qmodem-smsd|qmodem-settings|qmodem-seal|libqmodem-sms|luci-app-qmodem|sms-forwarder-next|quectel-CM-5G-M)' \
            .config |
            tee "$LOG_DIR/final-qmodem.txt" \
            || true


          # ========================================================
          # 旧版主程序
          # ========================================================

          if grep -q \
            '^CONFIG_PACKAGE_luci-app-qmodem=y' \
            .config; then

            echo "❌ 旧版 luci-app-qmodem 仍然启用"
            exit 1

          fi


          if grep -q \
            '^CONFIG_PACKAGE_luci-app-qmodem-sms=y' \
            .config; then

            echo "❌ 旧版 luci-app-qmodem-sms 仍然启用"
            exit 1

          fi


          if grep -q \
            '^CONFIG_PACKAGE_luci-app-qmodem-ttl=y' \
            .config; then

            echo "❌ 旧版 luci-app-qmodem-ttl 仍然启用"
            exit 1

          fi

          echo "✅ 旧版 QModem 主程序全部关闭"


          # ========================================================
          # 旧版中文语言包
          # ========================================================

          if grep -q \
            '^CONFIG_PACKAGE_luci-i18n-qmodem-zh-cn=y' \
            .config; then

            echo "❌ 旧版 luci-i18n-qmodem-zh-cn 仍然启用"
            exit 1

          fi


          if grep -q \
            '^CONFIG_PACKAGE_luci-i18n-qmodem-sms-zh-cn=y' \
            .config; then

            echo "❌ 旧版 luci-i18n-qmodem-sms-zh-cn 仍然启用"
            exit 1

          fi


          if grep -q \
            '^CONFIG_PACKAGE_luci-i18n-qmodem-ttl-zh-cn=y' \
            .config; then

            echo "❌ 旧版 luci-i18n-qmodem-ttl-zh-cn 仍然启用"
            exit 1

          fi

          echo "✅ 旧版 QModem 中文语言包全部关闭"


          # ========================================================
          # SIP / VOIP
          # ========================================================

          if grep -q \
            '^CONFIG_PACKAGE_qmodem-sipd=y' \
            .config; then

            echo "❌ qmodem-sipd 仍然启用"
            exit 1

          fi


          if grep -q \
            '^CONFIG_PACKAGE_qmodem-voip=y' \
            .config; then

            echo "❌ qmodem-voip 仍然启用"
            exit 1

          fi

          echo "✅ SIP / VOIP 全部关闭"


          # ========================================================
          # Next UI
          # ========================================================

          grep -q \
            '^CONFIG_PACKAGE_luci-app-qmodem-next=y' \
            .config || {
              echo "❌ luci-app-qmodem-next 未启用"
              exit 1
            }


          grep -q \
            '^CONFIG_PACKAGE_qmodem=y' \
            .config || {
              echo "❌ qmodem 核心未启用"
              exit 1
            }


          grep -q \
            '^CONFIG_PACKAGE_sms-forwarder-next=y' \
            .config || {
              echo "❌ sms-forwarder-next 未启用"
              exit 1
            }


          grep -q \
            '^CONFIG_PACKAGE_quectel-CM-5G-M=y' \
            .config || {
              echo "❌ quectel-CM-5G-M 未启用"
              exit 1
            }

          echo "✅ QModem Next 核心检查通过"


          # ========================================================
          # 保存最终配置
          # ========================================================

          cp .config \
            "$LOG_DIR/final.config"


          echo
          echo "── TARGET ──"

          grep '^CONFIG_TARGET_' .config |
            head -20 |
            tee "$LOG_DIR/final-target.txt" \
            || true


          echo
          echo "── KERNEL ──"

          grep -E \
            'CONFIG_LINUX_|CONFIG_TESTING_KERNEL' \
            .config |
            tee "$LOG_DIR/final-kernel.txt" \
            || true


          echo
          echo "── WIFI ──"

          grep -E \
            'CONFIG_PACKAGE_(wifi-scripts|kmod-mac80211|kmod-cfg80211|kmod-mt76|kmod-mt7915e|kmod-mt7981-firmware|wireless-regdb|iwinfo)' \
            .config |
            tee "$LOG_DIR/final-wifi.txt" \
            || true


          echo
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "✅ FINAL CONFIG 完成"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"


      # ==========================================================
      # 17. QModem 依赖诊断
      # ==========================================================

      - name: 🔎 QModem 依赖诊断
        shell: bash
        run: |
          set -Eeuo pipefail

          cd openwrt

          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🔎 QMODEM DEPENDENCY CHECK"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          if [ -f tmp/.config-package.in ]; then

            grep -ni \
              -E \
              'qmodem|quectel|mhi-wwan' \
              tmp/.config-package.in |
              head -500 |
              tee "$LOG_DIR/dependency-qmodem.txt" \
              || true

          fi

          echo
          echo "── QModem Makefile ──"

          grep -Rni \
            -E \
            'kmod-mhi-wwan|quectel-CM-5G' \
            package/feeds/qmodem \
            feeds \
            2>/dev/null |
            head -200 |
            tee "$LOG_DIR/qmodem-makefile-deps.txt" \
            || true


      # ==========================================================
      # 18. DL Cache
      # ==========================================================

      - name: ♻️ 恢复下载缓存
        if: github.event.inputs.build_mode == 'fast'
        id: dl_restore
        uses: actions/cache/restore@v4
        with:
          path: openwrt/dl

          key: dl-${{ runner.os }}-${{ github.event.inputs.device }}

          restore-keys: |
            dl-${{ runner.os }}-


      # ==========================================================
      # 19. Build Cache
      # ==========================================================

      - name: ♻️ 恢复编译缓存
        if: github.event.inputs.build_mode == 'fast'
        id: build_restore
        uses: actions/cache/restore@v4
        with:
          path: |
            openwrt/build_dir
            openwrt/staging_dir
            openwrt/tmp

          key: build-${{ runner.os }}-${{ github.event.inputs.device }}-${{ env.LEDE_SHORT }}-${{ steps.hash.outputs.config_hash }}-${{ steps.hash.outputs.diy_hash }}

          restore-keys: |
            build-${{ runner.os }}-${{ github.event.inputs.device }}-${{ env.LEDE_SHORT }}-${{ steps.hash.outputs.config_hash }}-
            build-${{ runner.os }}-${{ github.event.inputs.device }}-${{ env.LEDE_SHORT }}-


      # ==========================================================
      # 20. ccache
      # ==========================================================

      - name: ♻️ 恢复 ccache
        if: github.event.inputs.build_mode == 'fast'
        id: ccache_restore
        uses: actions/cache/restore@v4
        with:
          path: ~/.ccache

          key: ccache-${{ runner.os }}-${{ github.event.inputs.device }}-${{ steps.hash.outputs.config_hash }}-${{ steps.hash.outputs.diy_hash }}

          restore-keys: |
            ccache-${{ runner.os }}-${{ github.event.inputs.device }}-
            ccache-${{ runner.os }}-


      # ==========================================================
      # 21. 配置 ccache
      # ==========================================================

      - name: ⚡ 配置 ccache
        shell: bash
        run: |
          set -Eeuo pipefail

          mkdir -p ~/.ccache

          ccache -M "$CCACHE_MAXSIZE"
          ccache --set-config=compression=true

          echo "CCACHE_DIR=$HOME/.ccache" >> "$GITHUB_ENV"

          echo
          ccache -s


      # ==========================================================
      # 22. 下载依赖
      # ==========================================================

      - name: ⬇️ 下载编译依赖
        shell: bash
        run: |
          set -Eeuo pipefail

          cd openwrt

          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "⬇️ MAKE DOWNLOAD"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          make download \
            -j8 \
            V=s \
            2>&1 |
            tee "$LOG_DIR/download.log"

          STATUS=${PIPESTATUS[0]}

          if [ "$STATUS" -ne 0 ]; then
            echo "❌ make download 失败"
            exit "$STATUS"
          fi

          echo
          echo "── 异常小文件 ──"

          find dl \
            -type f \
            -size -1024c \
            -exec ls -lh {} \; \
            2>/dev/null \
            || true
                  # ==========================================================
      # 23. 编译固件
      # ==========================================================

      - name: 🔨 编译固件
        id: build
        shell: bash
        run: |
          set -Eeuo pipefail

          cd openwrt

          export PATH="/usr/lib/ccache:$PATH"
          export CCACHE_DIR="$HOME/.ccache"

          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🔨 开始编译"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          echo "🧵 JOBS = $MAKE_JOBS"

          make kernelversion || true

          echo
          echo "💾 磁盘"
          df -h

          echo
          echo "🧠 内存"
          free -h

          echo
          echo "📦 ccache"
          ccache -s

          BUILD_START=$(date +%s)

          echo "BUILD_START=$BUILD_START" >> "$GITHUB_ENV"

          echo
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🚀 MAKE WORLD"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          set +e

          make -j"$MAKE_JOBS" V=sc \
            2>&1 |
            tee "$LOG_DIR/build.log"

          BUILD_STATUS=${PIPESTATUS[0]}

          set -e

          BUILD_END=$(date +%s)
          BUILD_TIME=$((BUILD_END - BUILD_START))

          echo "BUILD_STATUS=$BUILD_STATUS" \
            > "$LOG_DIR/build-status.txt"

          echo "BUILD_TIME=$BUILD_TIME" \
            >> "$LOG_DIR/build-status.txt"

          echo
          echo "⏱️ 编译耗时：${BUILD_TIME} 秒"

          if [ "$BUILD_STATUS" -eq 0 ]; then

            echo
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "✅ 编译成功"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

            ccache -s

            exit 0

          fi


          # ========================================================
          # 编译失败
          # ========================================================

          echo
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "❌ 并行编译失败"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          echo
          echo "── 最后 200 行 ──"

          tail -200 "$LOG_DIR/build.log" |
            tee "$LOG_DIR/build-tail-200.txt"


          echo
          echo "── 错误关键字 ──"

          grep -i -E \
            'error:|ERROR:|Error [0-9]+|failed|cannot find|cannot satisfy|unresolved|No rule to make|No such file|Collected errors|dependency' \
            "$LOG_DIR/build.log" |
            tail -300 |
            tee "$LOG_DIR/build-errors.txt" \
            || true


          echo
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🔁 单线程诊断编译"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          set +e

          make -j1 V=sc \
            2>&1 |
            tee "$LOG_DIR/build-retry-j1.log"

          RETRY_STATUS=${PIPESTATUS[0]}

          set -e

          echo "RETRY_STATUS=$RETRY_STATUS" \
            >> "$LOG_DIR/build-status.txt"


          echo
          echo "── 单线程错误 ──"

          grep -i -E \
            'error:|ERROR:|Error [0-9]+|failed|cannot find|cannot satisfy|unresolved|No rule to make|No such file|Collected errors|dependency' \
            "$LOG_DIR/build-retry-j1.log" |
            tail -300 |
            tee "$LOG_DIR/retry-errors.txt" \
            || true


          echo
          echo "❌ 编译最终失败"

          exit "$BUILD_STATUS"


      # ==========================================================
      # 24. 获取内核版本
      # ==========================================================

      - name: 🔍 获取完整内核版本
        if: success()
        id: kernel
        shell: bash
        run: |
          set -Eeuo pipefail

          cd openwrt

          KERNEL=$(
            make kernelversion 2>/dev/null |
            grep -oE '[0-9]+\.[0-9]+\.[0-9]+' |
            head -1 ||
            true
          )

          if [ -z "$KERNEL" ]; then

            KERNEL=$(
              find build_dir \
                -type d \
                -name "linux-*" \
                2>/dev/null |
              sed 's#^.*/linux-##' |
              grep -oE '^[0-9]+\.[0-9]+\.[0-9]+' |
              sort -V |
              tail -1 ||
              true
            )

          fi

          if [ -z "$KERNEL" ]; then
            KERNEL="Unknown"
          fi

          COMMIT=$(git rev-parse --short HEAD)

          BUILD_TIME=$(date '+%Y-%m-%d %H:%M UTC')

          echo "kernel=$KERNEL" >> "$GITHUB_OUTPUT"
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
          echo "build_time=$BUILD_TIME" >> "$GITHUB_OUTPUT"

          echo
          echo "🐧 Kernel : $KERNEL"
          echo "🔖 Commit : $COMMIT"


      # ==========================================================
      # 25. 整理固件
      # ==========================================================

      - name: 📁 整理固件
        if: success()
        id: organize
        shell: bash
        run: |
          set -Eeuo pipefail

          mkdir -p upload

          find openwrt/bin/targets/ \
            -type f \
            \( \
              -name "*.bin" \
              -o -name "*.img.gz" \
              -o -name "*.itb" \
              -o -name "*.tar" \
              -o -name "*.gz" \
            \) \
            -exec cp {} upload/ \;

          cd upload

          shopt -s nullglob

          for f in *; do

            newname=$(
              echo "$f" |
              sed \
                -e 's/openwrt/MWRT-DONGZAI/g' \
                -e 's/lede/MWRT-DONGZAI/g'
            )

            if [ "$f" != "$newname" ]; then
              mv "$f" "$newname"
            fi

          done

          echo
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📁 固件"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          ls -lh

          if [ -z "$(ls -A .)" ]; then
            echo "❌ 未找到固件"
            exit 1
          fi

          echo
          echo "✅ 固件数量：$(find . -maxdepth 1 -type f | wc -l)"


      # ==========================================================
      # 26. Artifact
      # ==========================================================

      - name: 📤 上传固件 Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MWRT-DONGZAI_${{ github.event.inputs.device }}_K${{ steps.kernel.outputs.kernel }}_${{ github.run_number }}
          path: upload/
          if-no-files-found: error
          retention-days: 30


      # ==========================================================
      # 27. Release Tag
      # ==========================================================

      - name: 🏷️ 生成 Release 标签
        if: success()
        id: tag
        shell: bash
        run: |
          set -Eeuo pipefail

          DEVICE="${{ github.event.inputs.device }}"
          KERNEL="${{ steps.kernel.outputs.kernel }}"

          DATE=$(date +'%Y.%m.%d')
          TIME=$(date +'%H%M')

          TAG="MWRT-DONGZAI-${DEVICE^^}-K${KERNEL}-${DATE}-${TIME}"

          echo "release_tag=$TAG" >> "$GITHUB_OUTPUT"

          echo "🏷️ Release Tag:"
          echo "$TAG"


      # ==========================================================
      # 28. GitHub Release
      # ==========================================================

      - name: 🚀 发布到 GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:

          tag_name: ${{ steps.tag.outputs.release_tag }}

          name: "🏗️ MWRT-DONGZAI · ${{ github.event.inputs.device }} · Linux ${{ steps.kernel.outputs.kernel }}"

          files: upload/*

          body: |
            ## 🏗️ MWRT-DONGZAI 固件

            | 项目 | 内容 |
            |---|---|
            | 📦 设备 | ${{ github.event.inputs.device }} |
            | 🐧 Linux | ${{ steps.kernel.outputs.kernel }} |
            | 🔖 LEDE | ${{ steps.kernel.outputs.commit }} |
            | 🕐 编译时间 | ${{ steps.kernel.outputs.build_time }} |
            | ⚡ 编译模式 | ${{ github.event.inputs.build_mode }} |

            ### 固件

            `*-squashfs-sysupgrade.bin`

            日常升级推荐使用此文件。

            ### 注意

            - 刷机前请备份原厂固件
            - 首次刷机请确认设备型号
            - 建议不要保留旧配置
            - 不同硬件版本不要混刷

          generate_release_notes: false

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


      # ==========================================================
      # 29. 最终诊断
      # ==========================================================

      - name: 🧪 收集最终诊断信息
        if: always()
        shell: bash
        run: |
          set +e

          mkdir -p "$LOG_DIR/final"

          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🧪 收集诊断信息"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          {
            echo "========== DATE =========="
            date -u

            echo
            echo "========== UNAME =========="
            uname -a

            echo
            echo "========== CPU =========="
            nproc
            lscpu

            echo
            echo "========== MEMORY =========="
            free -h

            echo
            echo "========== DISK =========="
            df -h

            echo
            echo "========== LOAD =========="
            uptime

            echo
            echo "========== OPENWRT SIZE =========="
            du -sh openwrt 2>/dev/null

          } > "$LOG_DIR/final/system.txt"


          if [ -d openwrt ]; then

            cd openwrt

            git rev-parse HEAD \
              > "$LOG_DIR/final/lede-commit.txt" \
              2>/dev/null

            git log --oneline -10 \
              > "$LOG_DIR/final/lede-log.txt" \
              2>/dev/null

            cp .config \
              "$LOG_DIR/final/final.config" \
              2>/dev/null


            {
              echo "========== CONFIG PACKAGE =========="

              grep '^CONFIG_PACKAGE_' .config |
                sort

              echo
              echo "========== TARGET =========="

              grep '^CONFIG_TARGET_' .config |
                sort

              echo
              echo "========== KERNEL =========="

              grep -E \
                '^CONFIG_(LINUX_|TESTING_KERNEL)' \
                .config |
                sort

            } > "$LOG_DIR/final/config-summary.txt"


            ./scripts/feeds list -s \
              > "$LOG_DIR/final/feeds.txt" \
              2>&1


            find package/feeds \
              -maxdepth 2 \
              -type d \
              > "$LOG_DIR/final/package-feeds.txt" \
              2>&1


            find tmp \
              -maxdepth 3 \
              -type f |
              head -500 \
              > "$LOG_DIR/final/tmp-files.txt" \
              2>&1


            grep -Rni \
              -E \
              'error:|ERROR:|failed|cannot find|cannot satisfy|unresolved|No rule to make|No such file|Collected errors|dependency' \
              tmp \
              2>/dev/null |
              tail -500 \
              > "$LOG_DIR/final/tmp-errors.txt"


            if [ -f tmp/.config-package.in ]; then

              grep -ni \
                -E \
                'qmodem|mhi-wwan|quectel|wifi-scripts' \
                tmp/.config-package.in |
                head -500 \
                > "$LOG_DIR/final/dependency-qmodem-wifi.txt"

            fi

          fi


          find "$LOG_DIR" \
            -type f \
            -printf '%p %s bytes\n' |
            sort \
            > "$LOG_DIR/file-list.txt"


          echo
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🧪 诊断信息收集完成"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"


      # ==========================================================
      # 30. 上传 DEBUG
      # ==========================================================

      - name: 📦 上传编译诊断包
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MWRT-DONGZAI-${{ github.event.inputs.device }}-DEBUG-${{ github.run_number }}
          path: |
            /tmp/mwrt-logs/
          if-no-files-found: warn
          retention-days: 30


      # ==========================================================
      # 31. 最终状态
      # ==========================================================

      - name: 📊 最终状态
        if: always()
        shell: bash
        run: |
          echo
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📊 MWRT BUILD SUMMARY"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          echo "设备       : ${{ github.event.inputs.device }}"
          echo "模式       : ${{ github.event.inputs.build_mode }}"
          echo "LEDE       : ${LEDE_SHORT:-Unknown}"
          echo "运行编号   : ${{ github.run_number }}"

          echo
          echo "Artifacts:"
          echo "  📦 固件 Artifact"
          echo "  🧪 DEBUG 诊断 Artifact"

          echo
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"


      # ==========================================================
      # 32. 保存 Feeds Cache
      # ==========================================================

      - name: 💾 保存 Feeds 缓存
        if: success() && github.event.inputs.build_mode == 'fast'
        uses: actions/cache/save@v4
        with:
          path: |
            openwrt/feeds
            openwrt/package/feeds

          key: feeds-${{ runner.os }}-${{ github.event.inputs.device }}-${{ env.LEDE_SHORT }}-${{ steps.hash.outputs.diy_hash }}


      # ==========================================================
      # 33. 保存 DL Cache
      # ==========================================================

      - name: 💾 保存下载缓存
        if: success()
        uses: actions/cache/save@v4
        with:
          path: openwrt/dl

          key: dl-${{ runner.os }}-${{ github.event.inputs.device }}


      # ==========================================================
      # 34. 保存 Build Cache
      # ==========================================================

      - name: 💾 保存编译缓存
        if: success() && github.event.inputs.build_mode == 'fast'
        uses: actions/cache/save@v4
        with:
          path: |
            openwrt/build_dir
            openwrt/staging_dir
            openwrt/tmp

          key: build-${{ runner.os }}-${{ github.event.inputs.device }}-${{ env.LEDE_SHORT }}-${{ steps.hash.outputs.config_hash }}-${{ steps.hash.outputs.diy_hash }}


      # ==========================================================
      # 35. 保存 ccache
      # ==========================================================

      - name: 💾 保存 ccache
        if: success() && github.event.inputs.build_mode == 'fast'
        uses: actions/cache/save@v4
        with:
          path: ~/.ccache

          key: ccache-${{ runner.os }}-${{ github.event.inputs.device }}-${{ steps.hash.outputs.config_hash }}-${{ steps.hash.outputs.diy_hash }}
