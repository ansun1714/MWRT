name: MWRT-DONGZAI

on:
  workflow_dispatch:
    inputs:
      device:
        description: 'target device'
        required: true
        default: 'wh3000pro'
        type: choice
        options:
          - wh3000
          - wh3000pro
          - re-sp-01b

env:
  LEDE_REPO: https://github.com/coolsnowwolf/lede
  LEDE_BRANCH: master

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: free disk
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          sudo docker image prune -a -f
          sudo apt-get clean
          sudo swapoff -a || true
          sudo rm -f /swapfile
          df -h

      - name: install tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses5-dev libssl-dev python3 python3-pyelftools \
            rsync unzip zlib1g-dev file wget curl ccache cmake ninja-build \
            jq rename libelf-dev device-tree-compiler patch

      - name: clone lede
        run: git clone --depth=1 -b "$LEDE_BRANCH" "$LEDE_REPO" openwrt

      - name: diy part1
        run: |
          chmod +x diy-part1.sh
          cd openwrt
          ../diy-part1.sh

      - name: feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: load device config
        run: |
          DEVICE="${{ github.event.inputs.device }}"
          case "$DEVICE" in
            wh3000)    cp wh3000.config    openwrt/.config ;;
            wh3000pro) cp wh3000pro.config openwrt/.config ;;
            re-sp-01b) cp re-sp-01b.config openwrt/.config ;;
            *) exit 1 ;;
          esac
          if [ "$DEVICE" = "re-sp-01b" ]; then
            grep -v "CONFIG_TARGET_.*_DEVICE_" openwrt/.config > /tmp/.config_patched
            echo "CONFIG_TARGET_ramips_mt7621_DEVICE_jdcloud_re-sp-01b=y" >> /tmp/.config_patched
            cp /tmp/.config_patched openwrt/.config
          fi

      - name: kernel
        run: |
          DEVICE="${{ github.event.inputs.device }}"
          sed -i \
            -e '/^CONFIG_TESTING_KERNEL=/d' \
            -e '/^# CONFIG_TESTING_KERNEL is not set/d' \
            -e '/^CONFIG_LINUX_6_6=/d' \
            -e '/^CONFIG_LINUX_6_12=/d' \
            -e '/^CONFIG_LINUX_6_18=/d' \
            openwrt/.config
          case "$DEVICE" in
            wh3000|wh3000pro)
              printf 'CONFIG_TESTING_KERNEL=y\n' >> openwrt/.config
              ;;
            re-sp-01b)
              printf '# CONFIG_TESTING_KERNEL is not set\n' >> openwrt/.config
              ;;
          esac

      - name: diy part2
        run: |
          chmod +x diy-part2.sh
          cd openwrt
          export DEVICE="${{ github.event.inputs.device }}"
          ../diy-part2.sh

      - name: defconfig
        run: |
          cd openwrt
          make defconfig
          sed -i \
            -e 's/^CONFIG_OPENVPN_.*ENABLE_DCO=y/# CONFIG_OPENVPN_openssl_ENABLE_DCO is not set/' \
            -e 's/^CONFIG_PACKAGE_kmod-ovpn-.*=y/# CONFIG_PACKAGE_kmod-ovpn-dco is not set/' \
            -e 's/^CONFIG_PACKAGE_luci-app-webdav=y/# CONFIG_PACKAGE_luci-app-webdav is not set/' \
            -e 's/^CONFIG_PACKAGE_nginx-mod-dav-ext=y/# CONFIG_PACKAGE_nginx-mod-dav-ext is not set/' \
            .config
          rm -rf feeds/packages/kernel/ovpn-dco package/feeds/packages/ovpn-dco

      - name: download
        run: |
          cd openwrt
          make download -j8

      - name: compile
        run: |
          cd openwrt
          set -o pipefail
          if make -j$(nproc) 2>&1 | tee /tmp/build.log; then
            echo "compile ok"
            cp -f /tmp/build.log "$GITHUB_WORKSPACE/build.log"
          else
            grep -nE "Collected errors|satisfy_dependencies|Cannot install|ERROR: package|ovpn-dco" /tmp/build.log | tail -50 || true
            tail -50 /tmp/build.log || true
            cp -f /tmp/build.log "$GITHUB_WORKSPACE/build.log" || true
            exit 1
          fi

      - name: upload fail log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 14
          if-no-files-found: ignore

      - name: pack firmware
        run: |
          mkdir -p upload
          find openwrt/bin/targets/ -type f \( -name "*.bin" -o -name "*.img.gz" -o -name "*.itb" -o -name "*.tar" \) -exec cp {} upload/ \;
          ls -lh upload
          if [ -z "$(ls -A upload)" ]; then
            echo "no firmware"
            exit 1
          fi

      - name: upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: upload/
          retention-days: 30

      - name: github release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mwrt-${{ github.run_number }}
          name: MWRT ${{ github.event.inputs.device }}
          files: upload/*
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
