name: 🏗️ MWRT-DONGZAI 固件编译（Linux 6.18 自动兼容）

on:
  workflow_dispatch:
    inputs:
      device:
        description: '📦 目标设备'
        required: true
        default: 'wh3000pro'
        type: choice
        options:
          - wh3000
          - wh3000pro
          - re-sp-01b

      clean_build:
        description: '🧹 是否完全清理编译'
        required: true
        default: false
        type: boolean

env:
  LEDE_REPO: https://github.com/coolsnowwolf/lede
  LEDE_BRANCH: master

  # GitHub Actions 缓存目录
  CCACHE_DIR: ${{ github.workspace }}/.ccache

jobs:

  build:

    runs-on: ubuntu-22.04

    permissions:
      contents: write

    steps:

      # ============================================================
      # 1. 显示编译信息
      # ============================================================
      - name: 🎯 MWRT 固件工厂
        shell: bash
        run: |
          set -e

          echo "============================================================"
          echo "              MWRT-DONGZAI 固件工厂"
          echo "============================================================"

          DEVICE="${{ github.event.inputs.device }}"

          case "$DEVICE" in
            wh3000)
              DNAME="华硅 WH3000"
              DSPEC="MT7981 ARM · 512MB RAM · eMMC"
              ;;
            wh3000pro)
              DNAME="华硅 WH3000 Pro"
              DSPEC="MT7981 ARM · 512MB RAM · eMMC"
              ;;
            re-sp-01b)
              DNAME="京东云无线宝 RE-SP-01B"
              DSPEC="MT7621 MIPS · 512MB RAM · 128GB eMMC"
              ;;
            *)
              echo "❌ 未知设备：$DEVICE"
              exit 1
              ;;
          esac

          echo "📦 设备       : $DNAME"
          echo "🔧 规格       : $DSPEC"
          echo "🐧 内核策略   : Filogic 自动跟随 Linux 6.18.x"
          echo "🧹 完全重编译 : ${{ github.event.inputs.clean_build }}"
          echo "🕐 时间       : $(date '+%Y-%m-%d %H:%M:%S UTC')"
          echo "🔖 Workflow   : MWRT-DONGZAI"
          echo "============================================================"


      # ============================================================
      # 2. 检出自己的 MWRT 仓库
      # ============================================================
      - name: 📥 检出 MWRT 仓库
        uses: actions/checkout@v4


      # ============================================================
      # 3. 释放 GitHub Runner 磁盘空间
      # ============================================================
      - name: 🧹 释放磁盘空间
        shell: bash
        run: |
          set -e

          echo ">>> 清理 GitHub Runner 无用组件..."

          sudo rm -rf \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/local/lib/android \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/share/powershell \
            /usr/local/lib/node_modules

          sudo docker image prune -a -f || true
          sudo apt-get clean || true

          sudo swapoff -a || true
          sudo rm -f /swapfile || true

          echo
          echo ">>> 当前磁盘空间："
          df -h

          echo
          echo ">>> 当前内存："
          free -h


      # ============================================================
      # 4. 安装编译环境
      # ============================================================
      - name: ⚙️ 初始化编译环境
        shell: bash
        run: |
          set -e

          sudo apt-get update -q

          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            g++ \
            gawk \
            gcc-multilib \
            g++-multilib \
            gettext \
            git \
            libncurses5-dev \
            libncurses-dev \
            libssl-dev \
            python3 \
            python3-pyelftools \
            rsync \
            unzip \
            zlib1g-dev \
            file \
            wget \
            curl \
            ccache \
            cmake \
            ninja-build \
            jq \
            rename \
            libelf-dev \
            device-tree-compiler \
            patch

          echo
          echo ">>> 工具版本："

          gcc --version | head -1
          clang --version | head -1
          python3 --version
          ccache --version | head -1


      # ============================================================
      # 5. 克隆 LEDE
      # ============================================================
      - name: 📦 克隆 LEDE 源码
        shell: bash
        run: |
          set -e

          echo ">>> 克隆：$LEDE_REPO"
          echo ">>> 分支：$LEDE_BRANCH"

          git clone \
            --depth=1 \
            -b "$LEDE_BRANCH" \
            "$LEDE_REPO" \
            openwrt

          mkdir -p openwrt/dl
          mkdir -p "$CCACHE_DIR"

          echo
          echo "============================================================"
          echo "LEDE 最新提交"
          echo "============================================================"

          git -C openwrt log -1 \
            --pretty=format:'commit: %H%nshort : %h%ndate   : %ci%nsubject: %s%n'

          echo
          echo "============================================================"


      # ============================================================
      # 6. 缓存下载文件
      # ============================================================
      - name: 💾 恢复 LEDE 下载缓存
        uses: actions/cache@v4
        with:
          path: openwrt/dl
          key: lede-dl-${{ runner.os }}-${{ hashFiles('openwrt/.config', 'wh3000.config', 'wh3000pro.config', 're-sp-01b.config') }}
          restore-keys: |
            lede-dl-${{ runner.os }}-


      # ============================================================
      # 7. 缓存 ccache
      # ============================================================
      - name: 💾 恢复 ccache 编译缓存
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-${{ github.event.inputs.device }}-${{ github.ref_name }}-${{ github.run_number }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ github.event.inputs.device }}-${{ github.ref_name }}-
            ccache-${{ runner.os }}-${{ github.event.inputs.device }}-
            ccache-${{ runner.os }}-


      # ============================================================
      # 8. DIY Part 1
      #
      # 这里非常关键：
      # 负责 Feeds、MSD、OpenClash、QMI、RE-SP-01B
      # 以及 Linux 6.18 MediaTek WED 942 补丁兼容。
      # ============================================================
      - name: 🔧 DIY Part 1 - Feeds + 内核兼容修复
        shell: bash
        run: |
          set -e

          chmod +x diy-part1.sh

          cd openwrt

          echo "============================================================"
          echo "开始执行 DIY Part 1"
          echo "============================================================"

          ../diy-part1.sh

          echo
          echo "============================================================"
          echo "DIY Part 1 执行完成"
          echo "============================================================"


      # ============================================================
      # 9. 更新 Feeds
      # ============================================================
      - name: 🔄 更新 Feeds
        shell: bash
        run: |
          set -e

          cd openwrt

          echo ">>> 更新所有 Feeds..."

          ./scripts/feeds update -a

          echo ">>> Feeds 更新完成"


      # ============================================================
      # 10. 安装 Feeds
      # ============================================================
      - name: 📦 安装 Feeds
        shell: bash
        run: |
          set -e

          cd openwrt

          echo ">>> 安装所有 Feeds..."

          ./scripts/feeds install -a

          echo ">>> Feeds 安装完成"


      # ============================================================
      # 11. 加载设备配置
      # ============================================================
      - name: 🎛️ 加载设备配置
        shell: bash
        run: |
          set -e

          DEVICE="${{ github.event.inputs.device }}"

          echo "============================================================"
          echo "加载设备配置：$DEVICE"
          echo "============================================================"

          case "$DEVICE" in

            wh3000)
              cp wh3000.config openwrt/.config
              ;;

            wh3000pro)
              cp wh3000pro.config openwrt/.config
              ;;

            re-sp-01b)
              cp re-sp-01b.config openwrt/.config
              ;;

            *)
              echo "❌ 未知设备：$DEVICE"
              exit 1
              ;;

          esac

          # --------------------------------------------------------
          # RE-SP-01B 强制修正 TARGET
          # --------------------------------------------------------
          if [ "$DEVICE" = "re-sp-01b" ]; then

            grep -v "CONFIG_TARGET_.*_DEVICE_" \
              openwrt/.config \
              > /tmp/.config_patched

            echo \
              "CONFIG_TARGET_ramips_mt7621_DEVICE_jdcloud_re-sp-01b=y" \
              >> /tmp/.config_patched

            mv /tmp/.config_patched openwrt/.config

            echo "✅ RE-SP-01B TARGET 已修正"

          fi

          echo
          echo ">>> 当前 TARGET："

          grep "CONFIG_TARGET_" openwrt/.config \
            | grep -v "^#" \
            | head -20 || true


      # ============================================================
      # 12. 配置内核
      #
      # WH3000 / WH3000 Pro：
      # 自动跟随 LEDE 当前 Linux 6.18.x testing kernel
      #
      # RE-SP-01B：
      # 不使用 testing kernel
      # ============================================================
      - name: 🐧 配置内核版本
        shell: bash
        run: |
          set -e

          DEVICE="${{ github.event.inputs.device }}"

          case "$DEVICE" in

            wh3000|wh3000pro)

              echo "============================================================"
              echo "Filogic / MT7981"
              echo "启用最新 Testing Kernel"
              echo "============================================================"

              sed -i '/CONFIG_TESTING_KERNEL=/d' openwrt/.config
              sed -i '/CONFIG_LINUX_6_6=/d' openwrt/.config
              sed -i '/CONFIG_LINUX_6_12=/d' openwrt/.config
              sed -i '/CONFIG_LINUX_6_18=/d' openwrt/.config

              echo "CONFIG_TESTING_KERNEL=y" \
                >> openwrt/.config

              echo "✅ CONFIG_TESTING_KERNEL=y"

              ;;

            re-sp-01b)

              echo "============================================================"
              echo "MT7621 / RE-SP-01B"
              echo "使用稳定内核"
              echo "============================================================"

              sed -i '/CONFIG_TESTING_KERNEL=/d' openwrt/.config
              sed -i '/CONFIG_LINUX_6_6=/d' openwrt/.config
              sed -i '/CONFIG_LINUX_6_12=/d' openwrt/.config
              sed -i '/CONFIG_LINUX_6_18=/d' openwrt/.config

              echo "# CONFIG_TESTING_KERNEL is not set" \
                >> openwrt/.config

              echo "⏭️ 使用稳定内核"

              ;;

          esac


      # ============================================================
      # 13. DIY Part 2
      # ============================================================
      - name: 🔧 DIY Part 2 - 文件定制
        shell: bash
        run: |
          set -e

          chmod +x diy-part2.sh

          cd openwrt

          export DEVICE="${{ github.event.inputs.device }}"

          ../diy-part2.sh


      # ============================================================
      # 14. 配置 ccache
      # ============================================================
      - name: ⚡ 配置 ccache
        shell: bash
        run: |
          set -e

          export CCACHE_DIR="$GITHUB_WORKSPACE/.ccache"

          mkdir -p "$CCACHE_DIR"

          ccache --set-config=max_size=3G
          ccache --set-config=compression=true

          echo ">>> ccache 目录：$CCACHE_DIR"

          ccache -s || true


      # ============================================================
      # 15. make defconfig
      # ============================================================
      - name: 📋 生成最终配置
        shell: bash
        run: |
          set -e

          cd openwrt

          echo "============================================================"
          echo "执行 make defconfig"
          echo "============================================================"

          make defconfig

          echo
          echo "============================================================"
          echo "TARGET"
          echo "============================================================"

          grep "CONFIG_TARGET_" .config \
            | grep -v "^#" \
            | head -20 || true

          echo
          echo "============================================================"
          echo "Kernel"
          echo "============================================================"

          grep -E \
            "CONFIG_LINUX_|CONFIG_TESTING_KERNEL" \
            .config \
            | head -20 || true

          echo
          echo "============================================================"
          echo "ccache"
          echo "============================================================"

          ccache -s || true


      # ============================================================
      # 16. 下载依赖
      # ============================================================
      - name: ⬇️ 下载编译依赖
        shell: bash
        run: |
          set -e

          cd openwrt

          echo "============================================================"
          echo "下载编译依赖"
          echo "============================================================"

          make download -j8

          echo
          echo ">>> 检查异常下载文件..."

          find dl \
            -size -1024c \
            -type f \
            -print \
            2>/dev/null || true

          echo
          echo ">>> 下载目录大小："

          du -sh dl || true


      # ============================================================
      # 17. 编译固件
      #
      # 关键修复：
      # 不再使用：
      #
      # make ... | tee ... | grep ... || true
      #
      # 避免 PIPESTATUS 判断错误。
      # ============================================================
      - name: 🔨 编译固件
        id: compile
        shell: bash
        run: |
          set -o pipefail

          cd openwrt

          CORES="$(nproc)"

          echo "============================================================"
          echo "开始编译 MWRT"
          echo "CPU 核心：$CORES"
          echo "============================================================"

          export CCACHE_DIR="$GITHUB_WORKSPACE/.ccache"

          START_TIME="$(date +%s)"

          if make -j"$CORES" V=s 2>&1 | tee /tmp/build.log; then

            END_TIME="$(date +%s)"
            ELAPSED="$((END_TIME - START_TIME))"

            echo
            echo "============================================================"
            echo "✅ 并行编译成功"
            echo "编译耗时：${ELAPSED} 秒"
            echo "============================================================"

          else

            echo
            echo "============================================================"
            echo "❌ 并行编译失败"
            echo "============================================================"

            echo
            echo ">>> 最后 250 行错误日志："
            tail -250 /tmp/build.log || true

            echo
            echo ">>> ccache 状态："
            ccache -s || true

            exit 1

          fi


      # ============================================================
      # 18. 上传失败日志
      # ============================================================
      - name: 📋 上传失败编译日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: MWRT-build-log-${{ github.event.inputs.device }}-${{ github.run_number }}
          path: |
            /tmp/build.log
            openwrt/tmp/
          retention-days: 14
          if-no-files-found: ignore


      # ============================================================
      # 19. 获取完整 Linux 内核版本
      # ============================================================
      - name: 🔍 获取完整内核版本
        id: kernel
        shell: bash
        run: |
          set -e

          cd openwrt

          KERNEL=""

          # --------------------------------------------------------
          # 方法 1：make kernelversion
          # --------------------------------------------------------
          KERNEL="$(
            make kernelversion 2>/dev/null \
            | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' \
            | head -1 \
            || true
          )"

          # --------------------------------------------------------
          # 方法 2：搜索 build_dir
          # --------------------------------------------------------
          if [ -z "$KERNEL" ]; then

            echo "⚠️ make kernelversion 未获取到版本"

            KERNEL="$(
              find build_dir \
                -type d \
                -name 'linux-*' \
                2>/dev/null \
              | sed 's#^.*/linux-##' \
              | grep -oE '^[0-9]+\.[0-9]+\.[0-9]+' \
              | sort -V \
              | tail -1 \
              || true
            )

          fi

          # --------------------------------------------------------
          # 方法 3：从 .config 获取
          # --------------------------------------------------------
          if [ -z "$KERNEL" ]; then

            echo "⚠️ build_dir 未找到完整版本"

            MAJOR_MINOR="$(
              grep '^CONFIG_LINUX_[0-9_]*=y' .config \
              | head -1 \
              | sed 's/CONFIG_LINUX_//' \
              | sed 's/=y//' \
              | tr '_' '.'
            )"

            if [ -n "$MAJOR_MINOR" ]; then
              KERNEL="${MAJOR_MINOR}.*"
            else
              KERNEL="Unknown"
            fi

          fi

          COMMIT="$(git rev-parse --short HEAD)"
          BUILD_TIME="$(date '+%Y-%m-%d %H:%M UTC')"

          echo "kernel=$KERNEL" \
            >> "$GITHUB_OUTPUT"

          echo "commit=$COMMIT" \
            >> "$GITHUB_OUTPUT"

          echo "build_time=$BUILD_TIME" \
            >> "$GITHUB_OUTPUT"

          echo
          echo "============================================================"
          echo "完整内核版本 : $KERNEL"
          echo "LEDE Commit  : $COMMIT"
          echo "编译时间     : $BUILD_TIME"
          echo "============================================================"


      # ============================================================
      # 20. 整理固件
      # ============================================================
      - name: 📁 整理固件
        shell: bash
        run: |
          set -e

          mkdir -p upload

          echo ">>> 搜索固件..."

          find openwrt/bin/targets/ \
            -type f \
            \( \
              -name "*.bin" \
              -o -name "*.img" \
              -o -name "*.img.gz" \
              -o -name "*.itb" \
              -o -name "*.tar" \
            \) \
            -exec cp {} upload/ \;

          cd upload

          # --------------------------------------------------------
          # 统一名称
          # --------------------------------------------------------
          for f in *; do

            [ -f "$f" ] || continue

            newname="$(
              echo "$f" \
              | sed \
                's/openwrt/MWRT-DONGZAI/g;
                 s/lede/MWRT-DONGZAI/g'
            )"

            if [ "$f" != "$newname" ]; then
              mv "$f" "$newname"
            fi

          done

          echo
          echo "============================================================"
          echo "固件列表"
          echo "===========================================================
